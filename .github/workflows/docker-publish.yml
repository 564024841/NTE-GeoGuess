name: Publish Docker image (single image)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 底图瓦片不在本仓库（独立仓库、无许可证声明），构建时拉一次打进镜像，
      # 这样部署端不需要再准备瓦片目录。Dockerfile 的 tiles 阶段会把它放进 /srv/tiles。
      - name: Fetch map tiles (baked into the image)
        run: |
          git clone --depth 1 https://github.com/Maa-NTE/MapSource.git MapSource
          z0=$(ls MapSource/tiles/0 | wc -l)
          total=$(find MapSource/tiles -name '*.jpg' | wc -l)
          echo "z=0 的 x 目录：$z0 ；瓦片总数：$total"
          test "$z0" -eq 51
          test "$total" -ge 3000

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=single-image
          cache-to: type=gha,mode=max,scope=single-image
