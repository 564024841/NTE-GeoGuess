# 图寻单镜像部署（一个容器同时提供游戏站、后台站与 API）
#
# 用法：
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d

name: nte-geoguess

services:
  app:
    container_name: nte-geoguess
    image: ${IMAGE_NAME:-ghcr.io/564024841/nte-geoguess}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 让已在运行的 watchtower 自动拉取新镜像（watchtower 需以 --label-enable 运行）
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      DATA_DIR: /data
      STATIC_DIR: /srv/game
      ADMIN_STATIC_DIR: /srv/admin

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 deploy/.env 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      TILES_DIR: /srv/tiles
      REQUIRE_TILES: ${REQUIRE_TILES:-1}
      # 内容数据（题库快照 / 坐标标定 / 区域标签落点）：默认指向下面挂载进来的目录，
      # 改数据只要覆盖宿主文件，不用重建镜像。
      SEED_DATA_FILE: ${SEED_DATA_FILE:-/srv/data-json/map-data.json}
      CALIBRATION_FILE: ${CALIBRATION_FILE:-/srv/data-json/navi-coordinate-calibration.json}
      REGION_POSITIONS_FILE: ${REGION_POSITIONS_FILE:-/srv/data-json/region-positions.json}
      SEED_IMAGES_DIR: /srv/seed-images/locations
      ICONS_DIR: /srv/icons
      TILE_URL_TEMPLATE: ${TILE_URL_TEMPLATE:-/mapsource-tiles/{z}/{x}/{y}.jpg}
      TILE_REDIRECT_BASE: ${TILE_REDIRECT_BASE:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8787}:8080"
    volumes:
      # SQLite 与后台上传截图持久化
      - ${DATA_HOST_DIR:-./data}:/data
      # 底图瓦片不在镜像里（镜像保持精简），必须从宿主目录挂进来。
      # 该目录要是完整瓦片集（z=-6..0 的 {z}/{x}/{y}.jpg）；以后更新瓦片，
      # 直接往这个宿主目录里覆盖文件即可，不需要重建镜像、也不需要重启容器。
      - ${TILES_HOST_DIR:-../../MapSource/tiles}:/srv/tiles
      # 内容数据目录（只读）：map-data.json / navi-coordinate-calibration.json /
      # region-positions.json 放这里；镜像里只带一份「最基本」的骨架。
      - ${SHARED_DATA_HOST_DIR:-../shared-data}:/srv/data-json:ro
