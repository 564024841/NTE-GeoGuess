# 图寻单镜像部署（一个容器同时提供游戏站、后台站与 API）
#
# 宝塔「Docker → Compose 项目」用法：本文件内容 → Compose 框，
# deploy/.env.example 的内容 → env 框（至少改 ADMIN_PASSWORD 和三个宿主目录）。
#
# 命令行用法：
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d

services:
  app:
    container_name: nte-geoguess
    image: "${IMAGE_NAME:-ghcr.io/564024841/nte-geoguess}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    # 让已在运行的 watchtower 自动拉取新镜像（watchtower 需以 --label-enable 运行）
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      NODE_ENV: production
      PORT: "8080"                  # 容器内监听端口，对外由 nginx 反代
      HOST: 0.0.0.0
      DATA_DIR: /data
      STATIC_DIR: /srv/game
      ADMIN_STATIC_DIR: /srv/admin
      SEED_IMAGES_DIR: /srv/seed-images/locations
      ICONS_DIR: /srv/icons

      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在 env 里设置 ADMIN_PASSWORD（后台登录密码）}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"        # 走 HTTPS 必须 true，否则后台登录会立刻 401
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      LOGIN_MAX_ATTEMPTS: "${LOGIN_MAX_ATTEMPTS:-5}"
      LOGIN_WINDOW_MINUTES: "${LOGIN_WINDOW_MINUTES:-15}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"              # 同源部署留空
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      TILES_DIR: /srv/tiles
      REQUIRE_TILES: "${REQUIRE_TILES:-1}"           # 瓦片缺失时拒绝启动，避免"服务起了但底图全黑"
      # 注意：这里不能写成 "${TILE_URL_TEMPLATE:-/mapsource-tiles/{z}/{x}/{y}.jpg}" ——
      # compose 的变量替换遇到第一个 } 就结束，默认值里的 {z} 会把整行弄坏。
      # 留空则由服务端用它自己的默认模板，一样是 /mapsource-tiles/{z}/{x}/{y}.jpg。
      TILE_URL_TEMPLATE: "${TILE_URL_TEMPLATE:-}"
      TILE_REDIRECT_BASE: "${TILE_REDIRECT_BASE:-}"  # 交给对象存储/CDN 时填这里

      # 内容数据（题库快照 / 坐标标定 / 区域落点）：镜像里不带，直接读挂载进来的
      # data-json 目录 —— 覆盖宿主文件即生效，不用重建镜像；目录空则由入口脚本下载。
      SEED_DATA_FILE: /srv/data-json/map-data.json
      CALIBRATION_FILE: /srv/data-json/navi-coordinate-calibration.json
      REGION_POSITIONS_FILE: /srv/data-json/region-positions.json

      # 题面截图（每个点位一个子目录）。镜像里不带截图，从这个挂载目录读；
      # 目录空的时候由入口脚本下载一份，落在挂载目录里（持久化，之后不再重复下）。
      SEED_IMAGES_DIR: /srv/seed-images/locations
      SEED_IMAGES_AUTO_FETCH: "${SEED_IMAGES_AUTO_FETCH:-1}"
      # 留空 = 用镜像里的默认上游地址（MaaNTE-Map 的 tar.gz）；
      # 想换成自己的截图包就填 tar.gz 直链（里面是 locations/*.webp）。
      SEED_IMAGES_ARCHIVE_URL: "${SEED_IMAGES_ARCHIVE_URL:-}"
      REQUIRE_SEED_IMAGES: "${REQUIRE_SEED_IMAGES:-1}"

      # 启动自检：缺瓦片 / 缺截图 / 缺内容数据时自动下载补全（没权限或下载失败 = 直接报错退出）
      TILES_AUTO_FETCH: "${TILES_AUTO_FETCH:-1}"
      DATA_JSON_AUTO_FETCH: "${DATA_JSON_AUTO_FETCH:-1}"
      MAPSOURCE_REPO: "${MAPSOURCE_REPO:-Maa-NTE/MapSource}"
      GIT_REPO: "${GIT_REPO:-564024841/NTE-GeoGuess}"
      GIT_BRANCH: "${GIT_BRANCH:-main}"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8787}:8080"
    volumes:
      # 四个目录都要持久化，而且容器必须能写（缺文件时自检要补全）→ 不要加 :ro
      - "${DATA_HOST_DIR:-./data}:/data"                    # SQLite + 后台上传截图
      - "${TILES_HOST_DIR:-./tiles}:/srv/tiles"             # 完整底图瓦片（z=-6..0 的 {z}/{x}/{y}.jpg）
      - "${SHARED_DATA_HOST_DIR:-./data-json}:/srv/data-json"  # map-data.json / 标定 / 区域落点
      - "${SEED_IMAGES_HOST_DIR:-./seed-images}:/srv/seed-images"  # 题面截图（…/locations/<点位 id>/*.webp）
