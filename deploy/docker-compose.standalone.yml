# 图寻 · 宝塔「Docker → Compose 项目」用的单文件 compose（环境变量全部内联，不依赖 .env）
#
# 和 deploy/docker-compose.yml + deploy/.env.example 是一回事，只是把所有变量写死了。
# 如果你用宝塔的「Compose 框 + env 框」两个输入框，用那一对更方便；这一个适合
# 「只粘一个文件、不想管 env」的场合。
#
# 用法：宝塔面板 → Docker → Compose 项目 → 添加，把本文件内容粘进 Compose 框。
# 宝塔会把项目建在 /www/server/panel/data/compose/<项目名>/，
# 下面的相对路径就落在该项目目录里，例如 ./data → /www/server/panel/data/compose/nte-geoguess/data
#
# 部署前准备四个目录（相对本项目目录），容器要能写它们（缺失时自检会补全）：
#   ./data/         SQLite + 后台上传截图；容器以 uid 1000 写入 → chown -R 1000:1000
#   ./tiles/        完整底图瓦片，z=-6..0 的 {z}/{x}/{y}.jpg（约 30MB / 3516 张）
#   ./seed-images/  题面截图，…/locations/<点位 id>/*.webp（约 14MB / 476 张）
#   ./data-json/    map-data.json、navi-coordinate-calibration.json、region-positions.json
# 四个目录都可以先建成空的：容器启动时会自己下载（下完就留在宿主目录里，不会重复下）。

services:
  app:
    image: ghcr.io/564024841/nte-geoguess:latest
    container_name: nte-geoguess
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"                # 容器内监听；对外只绑本机 8787，交给宝塔 nginx 反代
      HOST: 0.0.0.0

      DATA_DIR: /data
      STATIC_DIR: /srv/game
      ADMIN_STATIC_DIR: /srv/admin

      ADMIN_PASSWORD: "change-me-please"   # ← 改成你自己的
      COOKIE_SECURE: "true"                # 走 HTTPS 必须 true，否则后台登录会立刻 401
      SESSION_TTL_HOURS: "12"
      LOGIN_MAX_ATTEMPTS: "5"
      LOGIN_WINDOW_MINUTES: "15"
      CORS_ORIGINS: ""                     # 同源部署留空

      TILES_DIR: /srv/tiles
      REQUIRE_TILES: "1"
      SEED_IMAGES_DIR: /srv/seed-images/locations
      SEED_IMAGES_AUTO_FETCH: "1"
      SEED_IMAGES_ARCHIVE_URL: ""     # 留空 = 用默认的上游地址；也可填自己的 tar.gz 直链
      REQUIRE_SEED_IMAGES: "1"
      ICONS_DIR: /srv/icons
      TILE_URL_TEMPLATE: "/mapsource-tiles/{z}/{x}/{y}.jpg"
      # 启动自检：缺瓦片 / 缺截图 / 缺内容数据时自动下载补全（=0 关闭）
      TILES_AUTO_FETCH: "1"
      DATA_JSON_AUTO_FETCH: "1"
      MAPSOURCE_REPO: "Maa-NTE/MapSource"
      GIT_REPO: "564024841/NTE-GeoGuess"
      GIT_BRANCH: "main"

      # 内容数据：不在 git 上更新，从 ./data-json 挂进来
      SEED_DATA_FILE: /srv/data-json/map-data.json
      CALIBRATION_FILE: /srv/data-json/navi-coordinate-calibration.json
      REGION_POSITIONS_FILE: /srv/data-json/region-positions.json

      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ./data:/data
      - ./tiles:/srv/tiles
      - ./seed-images:/srv/seed-images
      - ./data-json:/srv/data-json
    labels:
      # watchtower 带 --label-enable 时会自动拉新镜像重启（不带则会更新所有容器）
      com.centurylinklabs.watchtower.enable: "true"
