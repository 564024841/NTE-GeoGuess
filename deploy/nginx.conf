# 图寻 nginx 配置：
#   · 8080 → 游戏站（公开）
#   · 8081 → 后台站（务必只对内网开放，或再加一层 Basic Auth）
#   · /api、/images、/icons、/mapsource-tiles 反代到 server 容器
#
# 瓦片也可以让 nginx 直接读盘（更快，少一层代理）：
#   把下面的 location /mapsource-tiles/ 换成
#     alias /srv/tiles/;   （并挂载瓦片目录到 nginx）

upstream nte_geoguess_api {
  server server:8787;
  keepalive 32;
}

# 反代公共头
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 带缓存的素材与接口
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /srv/game;
  index index.html;

  # 单页应用：未命中的路径都交给 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 前端产物文件名带 hash，可以长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 截图与图标由服务端提供
  location /images/ { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }
  location /icons/  { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }
  location /api/    { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }
  location = /healthz { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }

  # 瓦片量大，单独放开缓存
  location /mapsource-tiles/ {
    proxy_pass http://nte_geoguess_api;
    include /etc/nginx/snippets/proxy-headers.conf;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

server {
  listen 8081;
  server_name _;
  root /srv/admin;
  index index.html;

  # ============ 后台访问控制 ============
  # 这里是最外层防线：只允许内网网段访问。
  # 公网部署时请改成你的办公网/VPN 网段，或改用 HTTP Basic Auth：
  #   auth_basic "NTE Admin";
  #   auth_basic_user_file /etc/nginx/.htpasswd;
  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 后台要调管理接口与看截图
  location /api/    { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }
  location /images/ { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }
  location /icons/  { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }
  location /mapsource-tiles/ { proxy_pass http://nte_geoguess_api; include /etc/nginx/snippets/proxy-headers.conf; }

  gzip on;
  gzip_types text/css application/javascript application/json;
  gzip_min_length 1024;
}
